[package]
name = "lmsql"
version = "0.3.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
authors = ["Lattice Systems LLC"]
description = "One SQL statement in, structured JSON out: a light SQL CLI for LLMs (lmapi native tool)"
repository = "https://github.com/lmctl-ai/lmsql"
readme = "README.md"
keywords = ["sql", "sqlite", "llm", "cli", "lmapi"]
categories = ["command-line-utilities", "database"]

[dependencies]
# lmapi server runtime. No default features: lmsql prints sorted-key JSON (no preserve_order).
lmrust = { git = "https://github.com/lmctl-ai/lmrust", tag = "v0.1.2", default-features = false }
# Bundled SQLite (no system library). hooks: authorizer + progress handler (timeouts);
# limits: SQLITE_LIMIT_ATTACHED = 0; column_decltype: declared column types in results.
rusqlite = { version = "0.32", features = ["bundled", "hooks", "limits", "column_decltype"] }
serde_json = "1"
# PostgreSQL (phase 2): sync driver, rustls TLS (ring provider), Mozilla roots. No system TLS.
postgres = "0.19"
fallible-iterator = "0.2"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
# geteuid: the default spill directory must belong to the current user.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Dev/test builds are optimized (SQLite's C code, serde_json and the generic code instantiated in
# lmsql), so the multi-million-row streaming tests run in seconds. Debug info is kept.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
strip = "symbols"
