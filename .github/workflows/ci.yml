name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lmsql
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: cargo fmt --check
        run: cargo +stable fmt --all --check

      - name: cargo clippy (all targets)
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.79 is the MSRV (Cargo.toml rust-version, same as lmrust).
        toolchain: [stable, "1.79"]
    steps:
      - name: Checkout lmsql
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install ${{ matrix.toolchain }} toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      # Explicit +toolchain: rust-toolchain.toml would otherwise select stable.
      - name: cargo test
        run: cargo +${{ matrix.toolchain }} test --locked

  schema-drift:
    name: Published schema is up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lmsql
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Fails when cli.schema.dev.json differs from `lmsql --schema` byte for byte, or when
      # cli.schema.latest.json is no longer an additive subset of it.
      - name: cli.schema.dev.json == lmsql --schema; latest is a subset
        run: cargo +stable test --locked --test lmapi -- schema_dev_file latest_is_an_additive_subset channel_files
